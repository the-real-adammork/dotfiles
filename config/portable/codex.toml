approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
personality = "pragmatic"
model = "gpt-6.1-sol"
approvals_reviewer = "user"
model_reasoning_summary = "auto"
hide_agent_reasoning = false
service_tier = "default"

[sandbox_workspace_write]
network_access = true

[features]
hooks = true
apps = false
js_repl = false
goals = true

[notice]
hide_full_access_warning = true

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."figma@openai-curated"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."compound-engineering@compound-engineering-plugin"]
enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
enabled = true

[mcp_servers.railway]
url = "https://mcp.railway.com"
enabled = false

[mcp_servers.nxt]
url = "https://nxt.fly.dev/mcp"

[mcp_servers.adobe-illustrator]
url = "http://localhost:18412/v1/mcp"
bearer_token_env_var = "ADOBE_ILLUSTRATOR_MCP_BEARER_TOKEN"
enabled = false

[mcp_servers.XcodeBuildMCP]
command = "xcodebuildmcp"
args = ["mcp"]

[mcp_servers.ios-simulator]
command = "npx"
args = ["-y", "ios-simulator-mcp@latest"]
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.ios-simulator.env]
IOS_SIMULATOR_MCP_IDB_PATH = "__HOME__/.local/bin/idb"

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[desktop]
ambient-suggestions-enabled = false
preventSleepWhileRunning = false
keepRemoteControlAwakeWhilePluggedIn = true
conversationDetailMode = "STEPS_PROSE"
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
sansFontSize = 14
codeFontSize = 13

[marketplaces.compound-engineering-plugin]
source_type = "git"
source = "https://github.com/EveryInc/compound-engineering-plugin.git"

[tui]
alternate_screen = "never"
vim_mode_default = true
